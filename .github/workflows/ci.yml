name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-build-and-test:
    name: Windows x64 ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check formatting
        shell: pwsh
        run: |
          $clangFormat = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\Llvm\x64\bin\clang-format.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $clangFormat) { Write-Error "clang-format introuvable sur le runner" }
          $files = Get-ChildItem src,tests -Recurse -File -Include *.cpp,*.h
          foreach ($f in $files) {
            & $clangFormat.FullName --dry-run --Werror $f.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Configure
        run: >-
          cmake -S . -B build -A x64
          -DBUILD_TESTING=ON
          -DVOCALMELODY_BUILD_APP=ON
          -DVOCALMELODY_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
